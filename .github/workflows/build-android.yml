name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 👇 新增：缓存 Gradle 依赖，加快 Android 打包
      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # 👇 新增：缓存 Rust 编译产物，这是省下那 20 分钟的关键！
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./apps/readest-app/src-tauri -> target"

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      - name: Install dependencies
        run: pnpm install

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Initialize Tauri Android Project
        run: |
          cd apps/readest-app
          npx tauri android init --ci

      # 👇 补全缺失的图标颜色资源（这次必定能过）
      - name: Fix missing Android color resource
        run: |
          mkdir -p apps/readest-app/src-tauri/gen/android/app/src/main/res/values
          cat << 'EOF' > apps/readest-app/src-tauri/gen/android/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          EOF

      - name: Build Android APK
        run: |
          cd apps/readest-app
          pnpm tauri android build --target=aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
